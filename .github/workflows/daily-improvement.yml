name: daily-improvement

# Jusqu'à 5 améliorations distinctes par jour, tirée de backlog/ (gratuit : aucune API, aucun secret).
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC chaque jour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-improvement
  cancel-in-progress: false

env:
  AUTHOR_NAME: adamelmenouar
  AUTHOR_EMAIL: adamelmenouar18@gmail.com
  PER_DAY: "5"

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Appliquer jusqu'à PER_DAY améliorations, valider chacune, commit, push
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

          done_count=0
          for i in $(seq 1 "$PER_DAY"); do
            item=$(ls -d backlog/*/ 2>/dev/null | sort | head -n1 || true)
            if [ -z "$item" ]; then
              echo "Backlog vide : rien de plus à faire (aucun commit vide)."
              break
            fi
            item=${item%/}
            msg=$(head -n1 "$item/message.txt")

            cp -r "$item/files/." .
            git rm -rq "$item"

            if ! pytest -q; then
              echo "::warning::Tests en échec pour $item : améliorations précédentes conservées, celle-ci annulée."
              git reset -q --hard HEAD
              git clean -fdq
              break
            fi

            git add -A
            git commit -q -m "$msg"   # horodatage réel ; échoue si rien à committer
            done_count=$((done_count + 1))
          done

          if [ "$done_count" -gt 0 ]; then
            git push origin HEAD:main
          fi
          echo "$done_count amélioration(s) poussée(s)."
