name: daily-improvement

# Une petite amélioration par jour, tirée de backlog/ (gratuit : aucune API, aucun secret).
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC chaque jour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-improvement
  cancel-in-progress: false

env:
  AUTHOR_NAME: adamelmenouar
  AUTHOR_EMAIL: adamelmenouar18@gmail.com

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Appliquer la prochaine amélioration, valider, commit, push
        run: |
          set -euo pipefail
          item=$(ls -d backlog/*/ 2>/dev/null | sort | head -n1 || true)
          if [ -z "$item" ]; then
            echo "Backlog vide : rien à faire aujourd'hui (aucun commit vide)."
            exit 0
          fi
          item=${item%/}
          msg=$(head -n1 "$item/message.txt")

          cp -r "$item/files/." .
          git rm -rq "$item"

          pip install -r requirements.txt
          pytest -q    # si ça échoue, le job s'arrête avant tout commit

          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add -A
          git commit -m "$msg"   # horodatage réel ; échoue si rien à committer
          git push origin HEAD:main
